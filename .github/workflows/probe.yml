name: Probe vxreddit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run probe
        env:
          DISCORD_CHANNEL_MAPPINGS: ${{ secrets.DISCORD_CHANNEL_MAPPINGS }}
        run: python probe.py
