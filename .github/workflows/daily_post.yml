name: Reddit Posts to Discord

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run multi-channel script
        env:
          DISCORD_CHANNEL_MAPPINGS: ${{ secrets.DISCORD_CHANNEL_MAPPINGS }}
        run: python bot.py

      - name: Commit dedup state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || (git commit -m "Update posted.json" && git pull --rebase && git push)