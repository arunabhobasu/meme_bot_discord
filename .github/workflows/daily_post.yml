name: Daily Reddit Posts to Discord

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run multi-channel script
        env:
          DISCORD_CHANNEL_MAPPINGS: ${{ secrets.DISCORD_CHANNEL_MAPPINGS }}
        run: python bot.py
